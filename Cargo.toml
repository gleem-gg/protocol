[package]
name = "gleem-protocol"
description = "Wire types shared by the Gleem machine agent, the signalling gateway and gleem.gg"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/gleem-gg/protocol"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
thiserror = "2"
